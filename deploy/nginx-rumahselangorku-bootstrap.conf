# Add this server block inside the existing http { ... } section before issuing
# the first certificate. Keep the cariproperty.my server blocks as they are.
server {
    listen 80;
    server_name rumahselangorku.online;

    # win-acme writes HTTP-01 tokens beneath this webroot.
    location ^~ /.well-known/acme-challenge/ {
        root C:/nginx/acme/rumahselangorku.online;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
