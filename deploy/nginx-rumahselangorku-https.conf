# Once win-acme has issued the certificate, replace the bootstrap block with
# these two blocks inside the existing http { ... } section.
server {
    listen 80;
    server_name rumahselangorku.online;

    # Leave port 80 available for unattended HTTP-01 renewals.
    location ^~ /.well-known/acme-challenge/ {
        root C:/nginx/html/build;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name rumahselangorku.online;

    ssl_certificate C:/nginx/cert/rumahselangorku.online-chain.pem;
    ssl_certificate_key C:/nginx/cert/rumahselangorku.online-key.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
